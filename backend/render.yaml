# Render blueprint - one-click deploy via https://render.com/deploy
services:
  - type: web
    name: docintel-backend
    env: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://doc-intel-delta.vercel.app
